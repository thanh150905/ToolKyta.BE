# LiteLLM gateway — giữ mọi API key, route theo model_name. Chạy: npm run gateway
# MỖI VAI MỘT KEY: mỗi entry có api_key riêng (đọc từ biến môi trường trong .env).
# ⚠ Thay tên model bên dưới bằng đúng model mà tài khoản của bạn được cấp.
model_list:
  - model_name: claude-coding
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gemini-test
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_1

  - model_name: gemini-qa
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY_2

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_1

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY_2

  - model_name: router-cheap
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY_1

litellm_settings:
  drop_params: true          # bỏ tham số model không hỗ trợ, để đổi provider không vỡ

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
